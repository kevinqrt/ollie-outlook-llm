name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pre-commit:
    name: Lint & Typecheck (Pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Pre-commit Hooks
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: pytest-backend # already implemented as own action
        # This action automatically executes all hooks from the .pre-commit-config.yaml file.
        # Since we are using system hooks (tsc, mypy), we have prepared Node and Python above.
