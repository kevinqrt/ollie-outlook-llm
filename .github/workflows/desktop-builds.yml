name: Desktop Builds

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build-desktop-windows.ps1'
      - 'build-desktop-windows.bat'
      - '.github/workflows/desktop-builds.yml'
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    outputs:
      asset_name: ${{ steps.package.outputs.asset_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Build Windows desktop host
        shell: pwsh
        run: .\scripts\build-desktop-windows.ps1

      - name: Package release asset
        id: package
        shell: pwsh
        run: |
          $assetDir = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "build-$env:GITHUB_RUN_NUMBER"
          }

          $assetName = "OllieDesktopHost-$version-windows-x64.exe"
          $source = Join-Path $env:GITHUB_WORKSPACE "backend\dist\OllieDesktopHost.exe"
          $target = Join-Path $assetDir $assetName

          Copy-Item $source $target -Force

          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: release-assets/${{ steps.package.outputs.asset_name }}
          if-no-files-found: error

  release-windows:
    name: Create Windows Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.asset_name }}
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/${{ needs.build-windows.outputs.asset_name }}
          generate_release_notes: true
