repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix, backend]
        pass_filenames: false
        always_run: true
      - id: ruff-format
        args: [backend]
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy backend
        entry: uv run --project backend mypy --config-file=backend/pyproject.toml backend/app
        language: system
        pass_filenames: false
        always_run: true
