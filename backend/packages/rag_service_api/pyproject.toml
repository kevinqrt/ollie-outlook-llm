[project]
name = "rag-service-api"
version = "0.1.0"
description = "Client for the University RAG Service"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "attrs>=23.2.0",
    "python-dateutil>=2.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_service_api"]

[tool.ruff]
line-length = 100
exclude = ["rag_service_api/generated"]
