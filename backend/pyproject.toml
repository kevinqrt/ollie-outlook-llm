[project]
name = "outlook-llm-backend"
version = "0.1.0"
description = "Minimal FastAPI backend for an Outlook LLM project."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27.0,<1.0",
    "pydantic-settings>=2.13.1",
    "rag-service-api",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "openapi-python-client>=0.21.0,<1.0",
    "mypy>=1.11.2",
    "ruff>=0.15.7",
    "watchdog>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "PTH", "SIM", "RUF", "S", "DTZ", "PGH", "TID", "FA", "PT"]
[tool.ruff.lint.per-file-ignores]
# In tests, it's okay to use asserts (S101)
"tests/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
files = ["app"]
strict = true

[tool.uv.workspace]
members = [
    "packages/rag_service_api",
]

[tool.uv.sources]
rag-service-api = { workspace = true }
