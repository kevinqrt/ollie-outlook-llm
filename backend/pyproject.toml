[project]
name = "outlook-llm-backend"
version = "1.0.0"
description = "Minimal FastAPI backend for an Outlook LLM project."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27.0,<1.0",
    "pydantic-settings>=2.13.1",
    "rag-service-api",
    "uvicorn[standard]>=0.30,<1.0",
    "pymupdf>=1.24.11",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5.5",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    "tokenizers>=0.22.0,<=0.23.0",
    "python-multipart>=0.0.9",
    "msal>=1.31.0",
    "mcp>=1.2.0",
    "tzdata>=2024.1",
    "icalendar>=6.0.0",
    "recurring-ical-events>=3.0.0",
]

[dependency-groups]
dev = [
    "openapi-python-client>=0.21.0,<1.0",
    "mypy>=1.11.2",
    "ruff>=0.15.7",
    "watchdog>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "prek>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "PTH", "SIM", "RUF", "S", "DTZ", "PGH", "TID", "FA", "PT"]
[tool.ruff.lint.per-file-ignores]
# In tests, it's okay to use asserts (S101) and mock tokens/secrets (S105)
"tests/**" = ["S101", "S105"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
files = ["app"]
strict = true

[[tool.mypy.overrides]]
module = "msal.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "recurring_ical_events.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["**/__init__.py"]

[tool.uv.workspace]
members = [
    "packages/rag_service_api",
]

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cpu"]

[tool.uv.sources]
rag-service-api = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
