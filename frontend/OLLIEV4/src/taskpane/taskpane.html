<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OLLIE</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>
<body>
<div class="pane">

    <header class="header">
        <div class="header-left">
            <img class="header-logo" src="/assets/ollie-logo.png" alt="OLLIE" onerror="this.style.display='none'" />
            <span class="header-title">ChatBot</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="settingsBtn" title="Einstellungen">⚙</button>
        </div>
    </header>

    <div class="settings-panel" id="settingsPanel" style="display:none">
        <label>API Basis-URL</label>
        <input type="text" id="apiUrl" value="http://localhost:8060" />
        <button class="save-btn" id="saveSettings">Session neu starten</button>
    </div>

    <main class="chat-area" id="chatArea">

        <div class="welcome-block">
            <img class="avatar" src="/assets/ollie-logo.png" alt="OLLIE" onerror="this.style.background='#e63946'" />
            <div class="welcome-bubble">
                <div class="welcome-name" id="welcomeName">Hallo!</div>
                <div class="welcome-sub">wie kann ich Ihnen helfen?</div>
            </div>
        </div>

        <div class="chips" id="chipsArea">
            <button class="test-btn" id="testBtn">Test</button>
            <button class="chip" id="chip1">KI Vorschlag 1</button>
            <button class="chip" id="chip2">KI Vorschlag 2</button>
            <button class="chip" id="chip3">KI Vorschlag 3</button>
            <button class="load-btn" id="loadSuggestions">✨ Vorschläge generieren</button>
        </div>

    </main>

    <!-- Datei-Upload -->
    <div class="upload-area" id="uploadArea">
        <label class="upload-label" for="fileInput">📎 Datei anhängen</label>
        <input type="file" id="fileInput" multiple accept=".pdf,.txt,.docx,.xlsx,.csv" />
        <div class="file-list" id="fileList"></div>
    </div>

    <footer class="footer">
        <input class="chat-input" id="chatInput" type="text" placeholder="Schreiben Sie hier Ihre Nachricht..." />
        <button class="send-btn" id="sendBtn">Senden</button>
    </footer>

</div>
</body>
</html>
